<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Majeed - Premium Islamic Player</title>
    <link rel="stylesheet" href="static/audio_quran.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="main-header">
            <div class="logo">
                <div class="logo-icon">🕋</div>
                <div>
                    <h1>Quran Majeed</h1>
                    <p>تلاوة القرآن الكريم</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="session-timer">
                    <span class="timer-icon">⏱️</span>
                    <span id="sessionTimer">00:00:00</span>
                </div>
                <div class="stat-badge">
                    <span>🎵</span>
                    <span id="totalAyahs">0</span>
                </div>
                <div class="stat-badge">
                    <span>📖</span>
                    <span id="currentStatus">Auto-Playing</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Dark/Light Mode">
                    🌙
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Right Side - Surahs -->
           

            <!-- Left Side - Ayahs -->
            <div class="ayah-section">
                <div class="section-header">
                    <div>
                        <h2 id="surahTitle">
                            <span>📖</span>
                            اختر سورة
                        </h2>
                        <p class="surah-info" id="surahInfo"></p>
                    </div>
                    <div class="search-box">
                        <input type="text" id="ayahSearch" placeholder="Search Ayat ....." class="search-input" disabled>
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
                <div class="ayah-container" id="ayahContainer">
                    <div class="empty-state">
                        <div class="empty-icon">🕌</div>
                        <!-- <p>اختر سورة من القائمة اليمنى للبدء</p>
                        <small>حدد أي سورة لبدء التلاوة</small> -->
                    </div>
                </div>
            </div>
             <div class="surah-section">
                <div class="section-header">
                    <h2>
                        <span>📚</span>
                        <!-- السور -->
                         Al-Quaran 
                    </h2>
                    <div class="search-box">
                        <input type="text" id="surahSearch" placeholder="Search Surah...." class="search-input">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
                <div class="surah-list" id="surahList">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>جاري تحميل السور...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/audio_quran.js"></script>
</body>
</html>
