{% extends "base.html" %}


{% block title %}
Read Quran
{% endblock %}


{% block head %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

    :root {
        --primary: #18352b;
        --primary-light: #285546;
        --accent: #c9a86a;
        --bg-soft: #f6f8f7;
        --text-muted: #6b7280;
        --border: #e5e7eb;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .quran-page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 60px 20px 80px;
    }

    .quran-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .quran-header h1 {
        font-size: clamp(28px, 4vw, 42px);
        color: var(--primary);
        margin: 0 0 14px;
    }

    /* ---------- Progress card ---------- */

    .progress-card {
        max-width: 820px;
        margin: 0 auto 30px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
        padding: 20px 24px;
    }

    .progress-card__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
    }

    .progress-card__label {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        letter-spacing: 0.4px;
    }

    .progress-card__count {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
    }

    .progress-track {
        width: 100%;
        height: 10px;
        background: var(--bg-soft);
        border-radius: 999px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--primary-light));
        border-radius: 999px;
        transition: width 0.4s ease;
    }

    .progress-card__bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    .progress-card__last {
        font-size: 13px;
        color: var(--text-muted);
    }

    .progress-card__last strong {
        color: var(--primary);
    }

    .progress-card__actions {
        display: flex;
        gap: 8px;
    }

    .btn-ghost {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
    }

    .btn-ghost:hover {
        background: var(--bg-soft);
        color: var(--primary);
    }

    /* ---------- Table ---------- */

    .para-table-wrap {
        margin: 0 auto;
        max-width: 820px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
        overflow: hidden;
    }

    .para-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
        table-layout: fixed;
    }

    .para-table thead {
        background: var(--bg-soft);
    }

    .para-table th {
        text-align: left;
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--primary);
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
    }

    .para-table th.center {
        text-align: center;
    }

    .para-table td {
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        color: #374151;
        vertical-align: middle;
    }

    .para-table tbody tr:hover {
        background: #fafcfb;
    }

    .para-table tbody tr:last-child td {
        border-bottom: none;
    }

    .para-table tbody tr.is-started {
        background: #f3f8f6;
    }

    .para-table th.col-num,
    .para-table td.col-num {
        width: 90px;
        text-align: center;
    }

    .para-table th.col-name,
    .para-table td.col-name {
        width: 38%;
    }

    .para-table th.col-arabic,
    .para-table td.col-arabic {
        width: 28%;
    }

    .para-table th.col-actions,
    .para-table td.col-actions {
        width: 150px;
        text-align: center;
    }

    .para-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        background: var(--bg-soft);
        color: var(--primary);
        border-radius: 10px;
        font-weight: 700;
        font-size: 14px;
        transition: background 0.2s ease, color 0.2s ease;
    }

    .para-table tbody tr:hover .para-number,
    .para-table tbody tr.is-started .para-number {
        background: var(--primary);
        color: #fff;
    }

    .para-english {
        font-weight: 600;
        color: var(--primary);
        display: block;
    }

    /* NEW: "Page X of Y" + start over under the name */
    .para-meta {
        display: none;
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-muted);
    }

    .para-meta.show {
        display: block;
    }

    .para-meta strong {
        color: var(--primary);
    }

    .para-meta .js-restart {
        margin-left: 8px;
        color: var(--accent);
        background: none;
        border: none;
        padding: 0;
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
    }

    .para-arabic {
        font-family: "Traditional Arabic", "Amiri", serif;
        font-size: 24px;
        color: var(--primary);
        direction: rtl;
        text-align: center;
        white-space: nowrap;
    }

    .para-actions {
        display: flex;
        justify-content: center;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .btn-primary {
        background: var(--primary);
        color: #ffffff;
    }

    .btn-primary:hover {
        background: var(--primary-light);
    }

    .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .state-message {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
    }

    .state-message strong {
        display: block;
        color: var(--primary);
        font-size: 17px;
        margin-bottom: 8px;
    }

    /* ============================================================
       Viewer
       ============================================================ */

    .viewer {
        display: none;
        position: fixed;
        inset: 0;
        background: #f3f5f4;
        z-index: 900;
        flex-direction: column;
    }

    .viewer.open {
        display: flex;
    }

    .viewer__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 20px;
        background: #ffffff;
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        flex-wrap: wrap;
    }

    .viewer__title {
        font-size: 15px;
        font-weight: 600;
        color: var(--primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 40%;
    }

    .viewer__page-info {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        padding: 6px 12px;
        border-radius: 8px;
        transition: background 0.2s ease;
    }

    .viewer__page-info:hover {
        background: var(--bg-soft);
    }

    .viewer__page-info strong {
        color: var(--primary);
    }

    .viewer__jump {
        width: 100px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        outline: none;
        display: none;
    }

    .viewer__jump:focus {
        border-color: var(--primary);
    }

    /* position: relative so child offsetTop is measured from this box.
       (scroll-behavior: smooth removed — it caused the animated scroll from page 1) */
    .viewer__body {
        flex: 1;
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
        background: #525659;
        padding: 30px 20px;
    }

    .viewer__pages {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Height now comes from inline aspect-ratio, so unrendered pages
       have the same height as rendered ones. */
    .viewer__page {
        position: relative;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .viewer__page canvas {
        display: block;
        width: 100%;
        height: auto;
    }

    .viewer__page-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: var(--text-muted);
        font-size: 13px;
    }

    .viewer__float {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: rgba(24, 53, 43, 0.9);
        color: #ffffff;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        z-index: 950;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .viewer.open .viewer__float {
        opacity: 1;
    }

    .viewer__progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: transparent;
        z-index: 951;
        pointer-events: none;
    }

    .viewer__progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.15s linear;
    }

    /* ---------- Mobile ---------- */

    @media (max-width: 720px) {

        .quran-page {
            padding: 40px 16px 60px;
        }

        .progress-card,
        .para-table-wrap {
            max-width: 100%;
        }

        .para-table {
            table-layout: auto;
        }

        .para-table thead {
            display: none;
        }

        .para-table,
        .para-table tbody,
        .para-table tr,
        .para-table td {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .para-table tr {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .para-table tr:last-child {
            border-bottom: none;
        }

        .para-table td {
            border: none;
            padding: 6px 0;
            width: 100% !important;
            text-align: left;
        }

        .para-table td::before {
            content: attr(data-label);
            display: block;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .para-arabic {
            text-align: left;
        }

        .para-actions {
            margin-top: 8px;
            justify-content: flex-start;
        }

        .btn {
            flex: 1;
        }

        .progress-card__bottom {
            flex-direction: column;
            align-items: stretch;
        }

        .progress-card__actions {
            width: 100%;
        }

        .progress-card__actions .btn {
            flex: 1;
        }

        .viewer__title {
            max-width: 100%;
            width: 100%;
        }

        .viewer__body {
            padding: 16px 10px;
        }

        .viewer__pages {
            gap: 16px;
        }

    }

</style>

{% endblock %}


{% block content %}

<section class="quran-page">

    <header class="quran-header">
        <h1>Read the Quran</h1>
    </header>


    <div class="progress-card">

        <div class="progress-card__top">
            <span class="progress-card__label">Your Reading Progress</span>
            <span class="progress-card__count" id="progress-count">0 of 30 Paras</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="progress-card__bottom">

            <span class="progress-card__last" id="progress-last">
                No Paras started yet.
            </span>

            <div class="progress-card__actions">

                <button type="button" class="btn btn-primary" id="btn-continue" disabled>
                    Continue Reading
                </button>

                <button type="button" class="btn btn-ghost" id="btn-reset">
                    Reset
                </button>

            </div>

        </div>

    </div>


    <div class="para-table-wrap">

        <table class="para-table">

            <thead>
                <tr>
                    <th class="col-num">SL.NO</th>
                    <th class="col-name">Name</th>
                    <th class="col-arabic center">Arabic</th>
                    <th class="col-actions">Actions</th>
                </tr>
            </thead>

            <tbody id="para-list">
                <tr>
                    <td colspan="4">
                        <div class="state-message">Loading Quran Paras...</div>
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</section>


<div id="pdf-viewer" class="viewer" aria-hidden="true">

    <div class="viewer__progress">
        <div class="viewer__progress-fill" id="scroll-progress"></div>
    </div>

    <div class="viewer__bar">

        <div class="viewer__title" id="viewer-title">Para</div>

        <div class="viewer__page-info" id="viewer-page-info" title="Click to jump">
            Page <strong>1</strong> of 1
        </div>

        <input
            type="number"
            id="page-jump-input"
            class="viewer__jump"
            min="1"
            placeholder="Go to page"
        />

        <button type="button" id="viewer-close" class="btn btn-primary">
            Close
        </button>

    </div>

    <div class="viewer__body" id="viewer-body">
        <div class="viewer__pages" id="viewer-pages"></div>
    </div>

    <div class="viewer__float" id="viewer-float">Page 1</div>

</div>


<script>

/* =========================================================
   PDF.js setup
   ========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   Refs
   ========================================================= */

const paraList       = document.getElementById("para-list");

const viewer         = document.getElementById("pdf-viewer");
const viewerTitle    = document.getElementById("viewer-title");
const viewerClose    = document.getElementById("viewer-close");
const viewerBody     = document.getElementById("viewer-body");
const viewerPages    = document.getElementById("viewer-pages");
const viewerPageInfo = document.getElementById("viewer-page-info");
const viewerFloat    = document.getElementById("viewer-float");
const scrollProgress = document.getElementById("scroll-progress");
const pageJumpInput  = document.getElementById("page-jump-input");

const progressFill   = document.getElementById("progress-fill");
const progressCount  = document.getElementById("progress-count");
const progressLast   = document.getElementById("progress-last");
const btnContinue    = document.getElementById("btn-continue");
const btnReset       = document.getElementById("btn-reset");


/* =========================================================
   Progress storage
   Shape:
   {
     paras: { "1": { page: 5, total: 28, updated: 17123456789 } },
     lastParaId: "1"
   }
   ========================================================= */

const STORAGE_KEY = "quran_reading_progress_v2";
const TOTAL_PARAS = 30;


function emptyProgress() {
    return { paras: {}, lastParaId: null };
}


function loadProgress() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return emptyProgress();

        const parsed = JSON.parse(raw);

        return {
            paras:      parsed.paras || {},
            lastParaId: parsed.lastParaId || null
        };
    } catch (e) {
        console.warn("Progress read failed:", e);
        return emptyProgress();
    }
}


function saveProgress(progress) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (e) {
        console.warn("Progress save failed:", e);
    }
}


/* ✅ FIX: saves the LAST page the user was on (not the furthest one),
   so reopening always lands exactly where they stopped. */
function recordProgress(paraId, page, total) {

    const idStr = String(paraId);
    const progress = loadProgress();
    const prev = progress.paras[idStr];

    progress.paras[idStr] = {
        page:    page,
        total:   total || (prev ? prev.total : 0),
        updated: Date.now()
    };

    progress.lastParaId = idStr;

    saveProgress(progress);
    renderProgress();
}


function resetProgress() {
    localStorage.removeItem(STORAGE_KEY);
    renderProgress();
}


function restartPara(paraId) {
    const progress = loadProgress();
    delete progress.paras[String(paraId)];

    if (progress.lastParaId === String(paraId)) {
        const remaining = Object.keys(progress.paras);
        progress.lastParaId = remaining.length ? remaining[remaining.length - 1] : null;
    }

    saveProgress(progress);
    renderProgress();
}


/* =========================================================
   Progress UI (main page)
   ========================================================= */

function getRowName(paraId) {
    const row = document.querySelector(
        `.para-table tbody tr[data-para-id="${paraId}"]`
    );
    return row ? row.querySelector(".para-english").textContent : "";
}


function renderProgress() {

    const progress   = loadProgress();
    const parasMap   = progress.paras;
    const startedIds = Object.keys(parasMap);

    const percent = Math.min(
        100,
        Math.round((startedIds.length / TOTAL_PARAS) * 100)
    );

    progressFill.style.width = percent + "%";
    progressCount.textContent = `${startedIds.length} of ${TOTAL_PARAS} Paras`;


    const lastId = progress.lastParaId;

    if (lastId && parasMap[lastId]) {

        const entry = parasMap[lastId];

        progressLast.innerHTML =
            `Last read: <strong>Para ${lastId}</strong>` +
            (entry.total
                ? ` — page ${entry.page} of ${entry.total}`
                : ` — page ${entry.page}`);

        btnContinue.disabled = false;
        btnContinue.dataset.paraId = lastId;

    } else {

        progressLast.textContent = "No Paras started yet.";
        btnContinue.disabled = true;
        delete btnContinue.dataset.paraId;

    }


    /* Update every row: highlight, "Page X of Y", View → Resume */
    document.querySelectorAll(".para-table tbody tr[data-para-id]").forEach(function (row) {

        const id    = row.dataset.paraId;
        const entry = parasMap[id];
        const meta  = row.querySelector(".para-meta");
        const btn   = row.querySelector(".js-view");

        if (entry) {

            row.classList.add("is-started");

            meta.classList.add("show");
            meta.innerHTML =
                `Page <strong>${entry.page}</strong>` +
                (entry.total ? ` of ${entry.total}` : "") +
                ` <button type="button" class="js-restart">Start over</button>`;

            btn.textContent = "Resume";

        } else {

            row.classList.remove("is-started");

            meta.classList.remove("show");
            meta.innerHTML = "";

            btn.textContent = "View";

        }

    });

}


/* =========================================================
   Viewer state
   ========================================================= */

let currentPdf    = null;
let currentParaId = null;
let currentTotal  = 0;
let currentPage   = 1;
let pageEls       = [];
let restoring     = false;   /* true while we jump to the saved page */
let scrollTicking = false;
let openToken     = 0;       /* guards against stale async opens */


/* =========================================================
   Open viewer
   ========================================================= */

async function openViewer(paraId, englishName, startPage = 1) {

    const token = ++openToken;

    currentParaId = String(paraId);
    currentPage   = startPage || 1;
    restoring     = true;

    viewerTitle.textContent = `Para ${paraId} — ${englishName || ""}`;

    viewer.classList.add("open");
    viewer.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

    viewerPages.innerHTML = "";
    pageEls = [];


    try {

        const pdf = await pdfjsLib.getDocument(`/api/quran/paras/${paraId}`).promise;

        if (token !== openToken) return;   /* viewer was closed / reopened */

        currentPdf   = pdf;
        currentTotal = pdf.numPages;

        if (currentPage < 1) currentPage = 1;
        if (currentPage > currentTotal) currentPage = currentTotal;


        /* ✅ FIX: use real page ratio so placeholder heights are accurate.
           That makes the jump to the saved page land exactly right. */
        const firstPage = await pdf.getPage(1);
        const vp        = firstPage.getViewport({ scale: 1 });
        const ratio     = `${vp.width} / ${vp.height}`;


        for (let i = 1; i <= currentTotal; i++) {

            const wrap = document.createElement("div");

            wrap.className = "viewer__page";
            wrap.dataset.page = i;
            wrap.style.aspectRatio = ratio;

            wrap.innerHTML =
                `<div class="viewer__page-loading">Page ${i}</div>`;

            viewerPages.appendChild(wrap);
            pageEls.push(wrap);

        }


        updateViewerInfo(currentPage, currentTotal);


        /* Instantly jump to saved page (no smooth animation) */
        scrollToPage(currentPage, false);

        await renderSpecificPage(currentPage);
        lazyRenderAround(currentPage);


        /* Save now that we know the real total */
        recordProgress(paraId, currentPage, currentTotal);

        handleScrollProgress();


        /* Only start listening for scrolls AFTER the jump is done */
        viewerBody.addEventListener("scroll", onViewerScroll, { passive: true });

        setTimeout(function () { restoring = false; }, 150);

    } catch (err) {

        console.error("PDF load error:", err);

        restoring = false;

        viewerPages.innerHTML =
            '<p style="color:#fff;text-align:center;padding:40px;">' +
            'Failed to load PDF.</p>';

    }

}


function scrollToPage(pageNum, smooth) {

    const target = pageEls[pageNum - 1];

    if (!target) return;

    viewerBody.scrollTo({
        top: Math.max(0, target.offsetTop - 20),
        behavior: smooth ? "smooth" : "auto"
    });

}


/* =========================================================
   Render pages
   ========================================================= */

async function renderSpecificPage(pageNum) {

    const wrap = pageEls[pageNum - 1];

    if (!wrap || wrap.dataset.rendered === "true") return;

    wrap.dataset.rendered = "true";

    const pdf = currentPdf;

    try {

        const page = await pdf.getPage(pageNum);

        if (pdf !== currentPdf) return;

        const containerWidth = wrap.clientWidth || viewerPages.clientWidth;
        const unscaled = page.getViewport({ scale: 1 });
        const scale    = Math.min(2.0, containerWidth / unscaled.width);
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement("canvas");

        canvas.width  = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width  = "100%";
        canvas.style.height = "auto";

        await page.render({
            canvasContext: canvas.getContext("2d"),
            viewport: viewport
        }).promise;

        const loading = wrap.querySelector(".viewer__page-loading");
        if (loading) loading.remove();

        wrap.appendChild(canvas);

    } catch (err) {

        wrap.dataset.rendered = "false";
        console.error("Render error page " + pageNum, err);

    }

}


function lazyRenderAround(pageNum) {

    const range = 2;

    for (let i = pageNum - range; i <= pageNum + range; i++) {
        if (i >= 1 && i <= currentTotal) {
            renderSpecificPage(i);
        }
    }

}


/* =========================================================
   Scroll tracking (replaces IntersectionObserver)
   Finds the page at ~30% from the top of the viewport and
   saves it as the current reading position.
   ========================================================= */

function onViewerScroll() {

    if (restoring || scrollTicking) return;

    scrollTicking = true;

    requestAnimationFrame(function () {

        scrollTicking = false;

        handleScrollProgress();
        detectCurrentPage();

    });

}


function detectCurrentPage() {

    if (!pageEls.length) return;

    const probe = viewerBody.scrollTop + viewerBody.clientHeight * 0.3;

    let found = pageEls.length;

    for (let i = 0; i < pageEls.length; i++) {
        const el = pageEls[i];
        if (el.offsetTop + el.offsetHeight > probe) {
            found = i + 1;
            break;
        }
    }

    if (found !== currentPage) {

        currentPage = found;

        updateViewerInfo(currentPage, currentTotal);
        lazyRenderAround(currentPage);
        recordProgress(currentParaId, currentPage, currentTotal);

    }

}


/* =========================================================
   Header info + float badge
   ========================================================= */

function updateViewerInfo(page, total) {

    viewerPageInfo.innerHTML = `Page <strong>${page}</strong> of ${total}`;
    viewerFloat.textContent  = `Page ${page}`;

    if (pageJumpInput) pageJumpInput.max = total;

}


function handleScrollProgress() {

    const max = viewerBody.scrollHeight - viewerBody.clientHeight;

    if (max <= 0) {
        scrollProgress.style.width = "100%";
        return;
    }

    scrollProgress.style.width = ((viewerBody.scrollTop / max) * 100) + "%";

}


/* =========================================================
   Page jump
   ========================================================= */

viewerPageInfo.addEventListener("click", function () {

    if (currentTotal <= 1) return;

    pageJumpInput.style.display = "inline-block";
    pageJumpInput.max   = currentTotal;
    pageJumpInput.value = currentPage;

    pageJumpInput.focus();
    pageJumpInput.select();

});


pageJumpInput.addEventListener("keydown", function (event) {

    if (event.key === "Enter") {

        const target = parseInt(pageJumpInput.value, 10);

        if (!isNaN(target) && target >= 1 && target <= currentTotal) {

            renderSpecificPage(target);
            scrollToPage(target, true);

        }

        pageJumpInput.style.display = "none";

    }

    if (event.key === "Escape") {
        event.stopPropagation();
        pageJumpInput.style.display = "none";
    }

});


document.addEventListener("click", function (event) {

    if (
        pageJumpInput.style.display !== "none" &&
        event.target !== pageJumpInput &&
        !viewerPageInfo.contains(event.target)
    ) {
        pageJumpInput.style.display = "none";
    }

});


/* =========================================================
   Close viewer
   ========================================================= */

function closeViewer() {

    openToken++;   /* cancel any in-flight open */

    /* Save the last known page before closing */
    if (currentParaId && !restoring && currentTotal) {
        recordProgress(currentParaId, currentPage, currentTotal);
    }

    viewer.classList.remove("open");
    viewer.setAttribute("aria-hidden", "true");

    document.body.style.overflow = "";

    viewerBody.removeEventListener("scroll", onViewerScroll);

    pageJumpInput.style.display = "none";

    viewerPages.innerHTML = "";
    pageEls = [];

    currentPdf    = null;
    currentParaId = null;
    currentTotal  = 0;
    restoring     = false;

}


viewerClose.addEventListener("click", closeViewer);


document.addEventListener("keydown", function (event) {

    if (event.key === "Escape" && viewer.classList.contains("open")) {
        closeViewer();
    }

});


/* Save position if the user switches tab / closes the browser */
function saveOnLeave() {

    if (currentParaId && currentTotal && !restoring) {

        const progress = loadProgress();

        progress.paras[currentParaId] = {
            page:    currentPage,
            total:   currentTotal,
            updated: Date.now()
        };

        progress.lastParaId = currentParaId;

        saveProgress(progress);

    }

}

document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveOnLeave();
});

window.addEventListener("pagehide", saveOnLeave);


/* =========================================================
   Continue / Reset
   ========================================================= */

btnContinue.addEventListener("click", function () {

    const paraId = btnContinue.dataset.paraId;

    if (!paraId) return;

    const entry = loadProgress().paras[paraId] || { page: 1 };

    openViewer(paraId, getRowName(paraId), entry.page);

});


btnReset.addEventListener("click", function () {

    if (confirm("Reset your reading progress?")) {
        resetProgress();
    }

});


/* =========================================================
   Load Paras
   ========================================================= */

async function loadParas() {

    try {

        const response = await fetch("/api/quran/paras");

        if (!response.ok) {
            throw new Error("Failed to load Paras");
        }

        const result = await response.json();
        const paras  = result.data || [];

        paraList.innerHTML = "";

        if (paras.length === 0) {

            paraList.innerHTML = `
                <tr>
                    <td colspan="4">
                        <div class="state-message">
                            <strong>No Paras available</strong>
                            Please check back later.
                        </div>
                    </td>
                </tr>
            `;

            return;
        }

        const fragment = document.createDocumentFragment();

        paras.forEach(function (para) {

            const row = document.createElement("tr");

            row.dataset.paraId = para.id;

            row.innerHTML = `

                <td class="col-num" data-label="SL.NO">
                    <span class="para-number">${para.id}</span>
                </td>

                <td class="col-name" data-label="Name">
                    <span class="para-english">${para.english_name}</span>
                    <span class="para-meta"></span>
                </td>

                <td class="col-arabic para-arabic" data-label="Arabic">
                    ${para.arabic_name}
                </td>

                <td class="col-actions" data-label="Actions">
                    <div class="para-actions">
                        <button type="button" class="btn btn-primary js-view">
                            View
                        </button>
                    </div>
                </td>

            `;

            /* View / Resume — always opens on the saved page */
            row.querySelector(".js-view").addEventListener("click", function () {

                const entry = loadProgress().paras[String(para.id)];

                openViewer(para.id, para.english_name, entry ? entry.page : 1);

            });

            /* Start over (button is re-created on each render → use delegation) */
            row.querySelector(".para-meta").addEventListener("click", function (e) {

                if (e.target.classList.contains("js-restart")) {
                    restartPara(para.id);
                }

            });

            fragment.appendChild(row);

        });

        paraList.appendChild(fragment);

        /* Render AFTER rows exist */
        renderProgress();

    } catch (error) {

        console.error(error);

        paraList.innerHTML = `
            <tr>
                <td colspan="4">
                    <div class="state-message">
                        <strong>Unable to load Quran Paras</strong>
                        Please try refreshing the page.
                    </div>
                </td>
            </tr>
        `;

    }

}


loadParas();

</script>
